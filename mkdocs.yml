site_name: Elastic MDS
site_description: MetaFluent Elastic MDS documentation
site_url: https://metafluent.github.io/ElasticMDS-docs/
copyright: Copyright &copy; MetaFluent
theme:
  variant: classic
  name: material
  logo: assets/images/logo.svg
  favicon: assets/images/favicon.svg
  font:
    text: Inter
  features:
    - navigation.path
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Light mode}
extra_css:
  - stylesheets/brand.css
extra:
  version:
    provider: mike
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
plugins:
  - search
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
